<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Faça login na plataforma DevBank com segurança e agilidade.">
  <title>DevBank</title>
  <link rel="shortcut icon" href="assets/1138038.png" type="image/x-icon">
  <link rel="stylesheet" href="style-tela-inicial.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body onload="loading()">

  <div class="box-load">
    <div class="pre"></div>
  </div>

  <div class="content">

    <header>
      <img src="assets/img-logo.png" alt="Logo DevBank">
    </header>

    <section class="container">
      <form action="#">
        <h1>Login DevBank</h1>

        <div class="input-box">
          <input type="url" placeholder="URL" required pattern="https?://.+" title="Inclua http:// ou https://">
          <i class="fas fa-globe"></i>
        </div>

        <div class="input-box">
          <input type="text" placeholder="Conta" required minlength="4" maxlength="20">
          <i class="fas fa-user"></i>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Senha" required minlength="8">
          <i class="fas fa-lock"></i>
        </div>

        <button type="submit" class="login">Entrar</button>
      </form>
    </section>

    <footer>
      <p>© 2025 DevBank - Todos os direitos reservados</p>
      <p>Segurança e privacidade garantidas</p>
    </footer>
  </div>

  <script src="animacao-preload.js"></script>
</body>

</html>
